  <script>
    let generatedFiles = {};
    let parsedTables = [];

    const SAMPLE_SQL = `CREATE DATABASE IF NOT EXISTS sistema_loja;

  status VARCHAR(50) DEFAULT 'pendente'

    window.onload = () => {
      loadSampleSQL();
    };

    function loadSampleSQL() {
      document.getElementById('sql-input').value = SAMPLE_SQL;
      generateAllCode();
    }

    // --- SQL PARSER ENGINE ---
    function extractDatabaseName(sqlText) {
      const cleanSql = sqlText.replace(/--.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
      const dbMatch = cleanSql.match(/CREATE\s+DATABASE\s+(?:IF\s+NOT\s+EXISTS\s+)?[`"']?(\w+)[`"']?/i);
      return dbMatch ? dbMatch[1] : null;
    }

    function parseSQL(sqlText) {
      const cleanSql = sqlText.replace(/--.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
      const createTableRegex = /CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?(?:[`"']?(\w+)[`"']?\.)?[`"']?(\w+)[`"']?\s*\(([\s\S]*?)\);/gi;

      const tables = [];
      let match;

      while ((match = createTableRegex.exec(cleanSql)) !== null) {
        const tableName = match[2] || match[1];
        const columnsBlock = match[3];

        const lines = splitColumns(columnsBlock);
        const columns = [];
        let primaryKey = 'id';

        lines.forEach(line => {
          line = line.trim();
          if (!line) return;

          const upper = line.toUpperCase();
          if (upper.startsWith('PRIMARY KEY') || upper.startsWith('CONSTRAINT')) {
            const pkMatch = line.match(/PRIMARY\s+KEY\s*\(([`"']?(\w+)[`"']?)\)/i);
            if (pkMatch) primaryKey = pkMatch[2];
            return;
          }
          if (upper.startsWith('FOREIGN KEY') || upper.startsWith('KEY') || upper.startsWith('UNIQUE')) {
            return;
          }

          const colMatch = line.match(/^[`"']?(\w+)[`"']?\s+([A-Za-z0-9_()]+)/);
          if (colMatch) {
            const colName = colMatch[1];
            const colType = colMatch[2].toUpperCase();
            if (/PRIMARY\s+KEY/i.test(line)) {
              primaryKey = colName;
            }
            columns.push({ name: colName, type: colType });
          }
        });

        if (tableName) {
          tables.push({
            name: tableName,
            columns: columns.length > 0 ? columns : [{ name: 'id', type: 'INT' }],
            primaryKey: primaryKey || (columns[0] ? columns[0].name : 'id')
          });
        }
      }

      return tables;
    }

    function splitColumns(block) {
      const parts = [];
      let current = '';
      let parenDepth = 0;

      for (let i = 0; i < block.length; i++) {
        const char = block[i];
        if (char === '(') parenDepth++;
        else if (char === ')') parenDepth--;

        if (char === ',' && parenDepth === 0) {
          parts.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      if (current.trim()) parts.push(current);
      return parts;
    }

    // --- GENERATOR CONTROLLER ---
    function generateAllCode() {
      const sqlInput = document.getElementById('sql-input').value;
      const projectName = document.getElementById('cfg-project-name').value.trim() || 'meu-backend-api';
      const dbType = document.getElementById('cfg-db-type').value;
      const serverPort = document.getElementById('cfg-server-port').value.trim() || '3000';
      const dbUser = document.getElementById('cfg-db-user').value.trim() || 'root';

      // Identifica automaticamente o nome do banco a partir do CREATE DATABASE no SQL
      const detectedDbName = extractDatabaseName(sqlInput);
      const dbNameInput = document.getElementById('cfg-db-name');
      if (detectedDbName) {
        dbNameInput.value = detectedDbName;
      }
      const dbName = dbNameInput.value.trim() || 'meubanco';

      document.getElementById('db-status-badge').textContent = dbType === 'mysql' ? 'MySQL / MariaDB' : 'PostgreSQL';

      parsedTables = parseSQL(sqlInput);
      renderParsedSummary(parsedTables);

      generatedFiles = {};

      // 1. package.json
      generatedFiles["package.json"] = JSON.stringify({
        name: projectName,
        version: "1.0.0",
        description: `API RESTful gerada automaticamente para ${dbType.toUpperCase()}`,
        main: "server.js",
        type: "module",
        scripts: {
          start: "node server.js",
          dev: "node --watch server.js"
        },
        dependencies: {
          express: "^4.18.2",
          dotenv: "^16.3.1",
          cors: "^2.8.5",
          [dbType === 'mysql' ? 'mysql2' : 'pg']: dbType === 'mysql' ? "^3.6.5" : "^8.11.3"
        }
      }, null, 2);

      // 2. config/script.sql (Salva o script SQL digitado pelo usuário)
      generatedFiles["config/script.sql"] = sqlInput;

      // 3. config/db.js
      if (dbType === 'mysql') {
        generatedFiles["config/db.js"] = `import mysql from 'mysql2/promise';
import dotenv from 'dotenv';
dotenv.config();

const db = mysql.createPool({
  host: process.env.DB_HOST || 'localhost',
  user: process.env.DB_USER || '${dbUser}',
  password: process.env.DB_PASS || '',
  database: process.env.DB_NAME || '${dbName}',
  port: process.env.DB_PORT || 3306,
  waitForConnections: true,
  connectionLimit: 10,
  queueLimit: 0
});

console.log('[Database] Pool de conexões MySQL configurado.');
export default db;
`;
      } else {
        generatedFiles["config/db.js"] = `import pkg from 'pg';
const { Pool } = pkg;
import dotenv from 'dotenv';
dotenv.config();

const db = new Pool({
  host: process.env.DB_HOST || 'localhost',
  user: process.env.DB_USER || '${dbUser}',
  password: process.env.DB_PASS || '',
  database: process.env.DB_NAME || '${dbName}',
  port: process.env.DB_PORT || 5432,
});

console.log('[Database] Pool de conexões PostgreSQL configurado.');
export default db;
`;
      }

      // 4. Controllers & Routes for each parsed table
      if (parsedTables.length === 0) {
        generatedFiles["controllers/exemploController.js"] = `// Nenhuma tabela detectada no SQL. Cole um CREATE TABLE para gerar controladores.`;
        generatedFiles["routes/exemploRoutes.js"] = `// Nenhuma tabela detectada.`;
      } else {
        parsedTables.forEach(table => {
          const tName = table.name;
          const pk = table.primaryKey;
          const nonPkCols = table.columns.filter(c => c.name.toLowerCase() !== pk.toLowerCase());

          // Controller
          if (dbType === 'mysql') {
            generatedFiles[`controllers/${tName}Controller.js`] = `import db from '../config/db.js';

// GET /api/${tName} - Listar todos
export const getAll = async (req, res) => {
  try {
    const [rows] = await db.query('SELECT * FROM ${tName}');
    res.json({ success: true, data: rows });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// GET /api/${tName}/:id - Buscar por ID
export const getById = async (req, res) => {
  try {
    const [rows] = await db.query('SELECT * FROM ${tName} WHERE ${pk} = ?', [req.params.id]);
    if (rows.length === 0) return res.status(404).json({ success: false, message: 'Registro não encontrado' });
    res.json({ success: true, data: rows[0] });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// POST /api/${tName} - Criar registro
export const create = async (req, res) => {
  try {
    const { ${nonPkCols.map(c => c.name).join(', ')} } = req.body;
    const [result] = await db.query(
      'INSERT INTO ${tName} (${nonPkCols.map(c => c.name).join(', ')}) VALUES (${nonPkCols.map(() => '?').join(', ')})',
      [${nonPkCols.map(c => c.name).join(', ')}]
    );
    res.status(201).json({ success: true, id: result.insertId, message: 'Registro criado com sucesso' });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// PUT /api/${tName}/:id - Atualizar registro
export const update = async (req, res) => {
  try {
    const { ${nonPkCols.map(c => c.name).join(', ')} } = req.body;
    const [result] = await db.query(
      'UPDATE ${tName} SET ${nonPkCols.map(c => `${c.name} = ?`).join(', ')} WHERE ${pk} = ?',
      [${nonPkCols.map(c => c.name).join(', ')}, req.params.id]
    );
    if (result.affectedRows === 0) return res.status(404).json({ success: false, message: 'Registro não encontrado' });
    res.json({ success: true, message: 'Registro atualizado com sucesso' });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// DELETE /api/${tName}/:id - Deletar registro
export const remove = async (req, res) => {
  try {
    const [result] = await db.query('DELETE FROM ${tName} WHERE ${pk} = ?', [req.params.id]);
    if (result.affectedRows === 0) return res.status(404).json({ success: false, message: 'Registro não encontrado' });
    res.json({ success: true, message: 'Registro deletado com sucesso' });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};
`;
          } else {
            // PostgreSQL Controller
            const pgPlaceholders = nonPkCols.map((_, i) => `$${i + 1}`).join(', ');
            const pgUpdateAssignments = nonPkCols.map((c, i) => `${c.name} = $${i + 1}`).join(', ');
            
            generatedFiles[`controllers/${tName}Controller.js`] = `import db from '../config/db.js';

// GET /api/${tName} - Listar todos
export const getAll = async (req, res) => {
  try {
    const result = await db.query('SELECT * FROM ${tName}');
    res.json({ success: true, data: result.rows });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// GET /api/${tName}/:id - Buscar por ID
export const getById = async (req, res) => {
  try {
    const result = await db.query('SELECT * FROM ${tName} WHERE ${pk} = $1', [req.params.id]);
    if (result.rows.length === 0) return res.status(404).json({ success: false, message: 'Registro não encontrado' });
    res.json({ success: true, data: result.rows[0] });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// POST /api/${tName} - Criar registro
export const create = async (req, res) => {
  try {
    const { ${nonPkCols.map(c => c.name).join(', ')} } = req.body;
    const result = await db.query(
      'INSERT INTO ${tName} (${nonPkCols.map(c => c.name).join(', ')}) VALUES (${pgPlaceholders}) RETURNING *',
      [${nonPkCols.map(c => c.name).join(', ')}]
    );
    res.status(201).json({ success: true, data: result.rows[0], message: 'Registro criado com sucesso' });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// PUT /api/${tName}/:id - Atualizar registro
export const update = async (req, res) => {
  try {
    const { ${nonPkCols.map(c => c.name).join(', ')} } = req.body;
    const result = await db.query(
      'UPDATE ${tName} SET ${pgUpdateAssignments} WHERE ${pk} = $${nonPkCols.length + 1} RETURNING *',
      [${nonPkCols.map(c => c.name).join(', ')}, req.params.id]
    );
    if (result.rowCount === 0) return res.status(404).json({ success: false, message: 'Registro não encontrado' });
    res.json({ success: true, data: result.rows[0], message: 'Registro atualizado' });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};

// DELETE /api/${tName}/:id - Deletar registro
export const remove = async (req, res) => {
  try {
    const result = await db.query('DELETE FROM ${tName} WHERE ${pk} = $1', [req.params.id]);
    if (result.rowCount === 0) return res.status(404).json({ success: false, message: 'Registro não encontrado' });
    res.json({ success: true, message: 'Registro deletado com sucesso' });
  } catch (error) {
    res.status(500).json({ success: false, error: error.message });
  }
};
`;
          }

          // Routes
          generatedFiles[`routes/${tName}Routes.js`] = `import express from 'express';
import { getAll, getById, create, update, remove } from '../controllers/${tName}Controller.js';

const router = express.Router();

router.get('/', getAll);

router.post('/', create);
router.put('/:id', update);
router.delete('/:id', remove);

export default router;
`;
        });
      }

      // 5. server.js
      generatedFiles["server.js"] = `import express from 'express';
import cors from 'cors';
import dotenv from 'dotenv';
${parsedTables.map(t => `import ${t.name}Routes from './routes/${t.name}Routes.js';`).join('\n')}

dotenv.config();

const app = express();
const PORT = process.env.PORT || ${serverPort};

app.use(cors());
app.use(express.json());

// Rota de teste / Healthcheck
app.get('/health', (req, res) => {
  res.json({ status: 'ok', project: '${projectName}', timestamp: new Date() });

    function renderParsedSummary(tables) {
      const countEl = document.getElementById('detected-count');
      const summaryEl = document.getElementById('parsed-summary');

      countEl.textContent = `${tables.length} tabela${tables.length !== 1 ? 's' : ''}`;

      if (tables.length === 0) {
        summaryEl.innerHTML = `<span class="text-slate-500 italic">Nenhum comando CREATE TABLE válido encontrado.</span>`;
        return;
      }

      summaryEl.innerHTML = tables.map(t => `
        <div class="flex items-center justify-between bg-slate-900 px-3 py-1.5 rounded border border-slate-800">
          <span class="text-slate-200 font-bold"><i class="fa-solid fa-table text-brand-400 mr-1.5"></i> ${t.name}</span>
          <span class="text-[11px] text-slate-400">${t.columns.length} colunas (PK: <span class="text-emerald-400">${t.primaryKey}</span>)</span>
        </div>
      `).join('');
    }

    // --- ZIP DOWNLOAD ---
    async function downloadAsZip() {
      const projectName = document.getElementById('cfg-project-name').value.trim() || 'meu-backend-api';

      if (!window.JSZip) {
        showToast('Erro', 'Biblioteca JSZip não carregada.', 'error');
        return;
      }

      const zip = new JSZip();
      const folder = zip.folder(projectName);

      Object.entries(generatedFiles).forEach(([filePath, content]) => {
        folder.file(filePath, content);
      });

      try {
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${projectName}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('ZIP Gerado!', `O arquivo ${projectName}.zip foi empacotado e baixado.`, 'success');
      } catch (err) {
        console.error(err);
        showToast('Erro no ZIP', err.message, 'error');
      }
    }

    // --- TOAST NOTIFICATIONS ---
    function showToast(title, desc, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');

      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-desc').textContent = desc;

      if (type === 'error') {
        icon.className = 'w-8 h-8 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center text-sm flex-shrink-0';
        icon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      } else if (type === 'info') {
        icon.className = 'w-8 h-8 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center text-sm flex-shrink-0';
        icon.innerHTML = '<i class="fa-solid fa-info"></i>';
      } else {
        icon.className = 'w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm flex-shrink-0';
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 4000);
    }
